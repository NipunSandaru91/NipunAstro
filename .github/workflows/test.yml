name: Test and Coverage

on:
  push:
    branches: [main, "refactor/**", "quality/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests with coverage
        run: deno test --clean --allow-env --coverage=coverage --coverage-threshold=100 tests

      - name: Print uncovered branches for diagnosis
        if: failure()
        run: |
          deno coverage --detailed coverage
          awk '/^SF:.*life-timeline/{show=1} show{print} show&&/^end_of_record/{exit}' coverage/lcov.info

      - name: Daily Swiss astronomy smoke
        run: deno run scripts/daily-sky-smoke.ts
