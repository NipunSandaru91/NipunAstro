name: Deep Dasha Database
on:
  pull_request:
  push:
    branches: [feature/life-timeline-daily-astro-v1]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/database/package-lock.json
      - run: npm ci --prefix tests/database
      - run: npm test --prefix tests/database
